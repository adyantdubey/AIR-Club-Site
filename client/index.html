<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050810" />
    <meta name="description" content="AI & Robotics Club, NIT Andhra Pradesh — building autonomous rovers, vision systems and neuromorphic hardware." />
    <title>AI & Robotics Club · NIT Andhra Pradesh</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,4 56,18 56,46 32,60 8,46 8,18' fill='none' stroke='%232D7BFF' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%232D7BFF'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden copies of the two forms so Netlify Forms can register the fields at
         build time. Invisible to visitors; harmless on every other host. -->
    <form name="air-join" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="text" name="name" /><input type="email" name="email" />
      <input type="text" name="branch" /><input type="text" name="team" />
      <textarea name="message"></textarea><input type="text" name="website" />
    </form>
    <form name="air-register" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="text" name="name" /><input type="email" name="email" />
      <input type="text" name="event" /><input type="text" name="website" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
